receivers:
  prometheus:
    config:
      global:
        scrape_interval: 15s

      scrape_configs:
        - job_name: "node_exporter"
          static_configs:
            - targets:
                - "localhost:9100"

processors:
  batch:
    timeout: 5s
    send_batch_size: 1000

exporters:
  prometheusremotewrite:
    endpoint: "https://aps-workspaces.us-east-1.amazonaws.com/workspaces/ws-XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX/api/v1/remote_write"

    auth:
      authenticator: sigv4auth

extensions:
  sigv4auth:
    region: us-east-1
    service: aps

service:
  extensions:
    - sigv4auth

  pipelines:
    metrics:
      receivers:
        - prometheus
      processors:
        - batch
      exporters:
        - prometheusremotewrite
