global:
  scrape_interval: 30s
  external_labels:
    cluster: demo-ec2
    region: ap-south-1

scrape_configs:
  # Self-scrape so prometheus_remote_storage_* metrics are stored and queryable
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node_exporter
    ec2_sd_configs:
      - region: ap-south-1
        port: 9100
        filters:
          - name: "tag:Monitoring"
            values: ["enabled"]
    relabel_configs:
      - source_labels: [__meta_ec2_tag_Name]
        target_label: instance_name
      - source_labels: [__meta_ec2_instance_state]
        regex: running
        action: keep

remote_write:
  - url: https://aps-workspaces.ap-south-1.amazonaws.com/workspaces/<WORKSPACE_ID>/api/v1/remote_write
    sigv4:
      region: ap-south-1
    queue_config:
      max_samples_per_send: 1000
      max_shards: 200
      capacity: 2500
